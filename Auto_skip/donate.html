<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donate</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ff8672;
            font-family: 'Quicksand', sans-serif;
        }
        .donate-button {
            background-color: #2196F3;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.4s;
            text-decoration: none;
        }
        .donate-button:hover {
            background-color: #1a78c2;
        }
        .timer {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="timer" id="timer">1s</div>
    <a href="https://www.paypal.com/donate/?hosted_button_id=BBKRUHCJLJ4QE" target="_blank">
        <button class="donate-button">Donate</button>
    </a>
    <script>
        let seconds = 1;
        const timerElement = document.getElementById('timer');
        const countdown = setInterval(() => {
            timerElement.textContent = `${--seconds}s`;
            if (seconds <= 0) {
                clearInterval(countdown);
                window.close();
            }
        }, 1000);
    </script>
</body>
</html>
