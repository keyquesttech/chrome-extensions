<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 300px;
            padding: 10px;
        }

        .option {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .option input {
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="option">
        <input type="checkbox" id="youtubeToggle">
        <label for="youtubeToggle">Enable YouTube Auto-Skip</label>
    </div>
    <div class="option">
        <input type="checkbox" id="netflixToggle">
        <label for="netflixToggle">Enable Netflix Auto-Skip</label>
    </div>
    <script src="popup.js"></script>
</body>

</html>
