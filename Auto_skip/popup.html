<!DOCTYPE html>
<html>

<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap');

        body {
            width: 200px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-color: #ff8672;
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin: 10px 0 0 0;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            margin-top: 15px;
        }

        .toggle-container label {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 18px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
            margin-left: 10px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
        }

        input:checked+.slider {
            background-color: #2196F3;
        }

        input:focus+.slider {
            box-shadow: 0 0 1px #2196F3;
        }

        input:checked+.slider:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }

        /* Rounded sliders */
        .slider.round {
            border-radius: 34px;
        }

        .slider.round:before {
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <h1>Auto skip</h1>
    <div class="toggle-container">
        <label for="youtubeToggle">YouTube</label>
        <label class="switch">
            <input type="checkbox" id="youtubeToggle">
            <span class="slider round"></span>
        </label>
        <span id="youtubeStatus"></span>
    </div>
    <div class="toggle-container">
        <label for="netflixToggle">Netflix</label>
        <label class="switch">
            <input type="checkbox" id="netflixToggle">
            <span class="slider round"></span>
        </label>
        <span id="netflixStatus"></span>
    </div>
    <script src="popup.js"></script>
</body>

</html>
